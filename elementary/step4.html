<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/jpeg" href="../favicon.jpg">
<title>STEP4 じぶんの気になるに｜探究テーマ発見ワークシート（小学生版）</title>
<link rel="stylesheet" href="../style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="app">
  <div id="app-header"></div>

  <div class="card">
    <h2>STEP4　えらんだことばを「自分の気になる」にしよう！</h2>
    <p class="lead">○をつけたことばから1つえらんで、書いてみよう。みじかいことばでだいじょうぶ！</p>

    <label class="field">① えらんだことば
      <select id="keyword"></select>
    </label>
    <label class="field">② どこが気になる？（れい：どうして人気なの？／どうやってできるの？／むかしとちがう？）
      <textarea id="curious"></textarea>
    </label>
    <label class="field">③ 自分とのつながりは？（れい：毎日つかう／家にある／むかしからすき／テレビで見た）
      <textarea id="connection"></textarea>
    </label>
    <label class="field">④ もっと知りたいこと（「〜って、ほんとうはどうなっているんだろう？」と思うこと）
      <textarea id="wantToKnow"></textarea>
    </label>
  </div>

  <div class="card" id="result-card" style="display:none;">
    <div class="done-banner" id="done-banner" style="display:none;">保存しました！お疲れさまでした。</div>
    <h2>結果まとめ</h2>
    <div id="pdf-area-step4">
      <p class="hint" id="profile-line-final"></p>
      <div class="hexagon-wrap"><div id="hexagon-final" class="hex-box"></div></div>
      <div class="summary-box" id="summary"></div>
    </div>
    <p class="lead" style="text-align:center;">おつかれさま！これが、きみの「しらべてみたいこと」のタネです。</p>
    <div class="final-actions">
      <button type="button" class="btn btn-primary" id="download-btn">グラフと回答をPDFでダウンロード</button>
      <button type="button" class="btn btn-ghost" id="print-btn">印刷する</button>
      <button type="button" class="btn btn-ghost" id="restart-btn">最初からやり直す</button>
      <button type="button" class="btn btn-ghost" id="finish-btn">終了する</button>
    </div>
  </div>

  <div id="nav"></div>
</div>

<script src="../app.js"></script>
<script>
  renderHeader(4, { labels: ES_STEP_LABELS, total: ES_STEP_LABELS.length - 1 });
  const auth = requireStudentAuth();
  const state = esLoadState();
  if (!state.scores) goTo("step1.html");

  const allKeywords = CAT_ORDER.flatMap(k =>
    (state.keywords[k] || []).concat(state.customKeywords[k] ? [state.customKeywords[k]] : [])
  );

  const select = document.getElementById("keyword");
  if (allKeywords.length === 0) {
    select.innerHTML = `<option value="">（STEP3でことばを選んでいません）</option>`;
  } else {
    select.innerHTML = allKeywords.map(kw =>
      `<option value="${kw}" ${state.step4.keyword === kw ? "selected" : ""}>${kw}</option>`
    ).join("");
  }

  document.getElementById("curious").value = state.step4.curious;
  document.getElementById("connection").value = state.step4.connection;
  document.getElementById("wantToKnow").value = state.step4.wantToKnow;

  navButtons("nav", {
    prevHref: "step3.html",
    nextLabel: "しあげる →"
  });

  document.getElementById("nav-next-btn").addEventListener("click", async () => {
    if (!auth) return;
    state.step4.keyword = select.value;
    state.step4.curious = document.getElementById("curious").value.trim();
    state.step4.connection = document.getElementById("connection").value.trim();
    state.step4.wantToKnow = document.getElementById("wantToKnow").value.trim();
    esSaveState(state);

    document.getElementById("profile-line-final").textContent =
      `名前：${state.profile.name || "-"}　学年：${state.profile.grade || "-"}　日付：${state.profile.date || "-"}`;
    renderHexagon(document.getElementById("hexagon-final"), state.scores, { maxVal: 10, categories: ES_CATEGORIES });
    document.getElementById("summary").textContent = buildSummaryTextES(state);
    document.getElementById("result-card").style.display = "block";
    document.getElementById("result-card").scrollIntoView({ behavior: "smooth" });

    const doneBanner = document.getElementById("done-banner");
    doneBanner.style.display = "block";
    doneBanner.textContent = "送信中...";
    const result = await submitAnswerES(auth, state);
    doneBanner.textContent = result.ok
      ? "送信しました！お疲れさまでした。（下からもダウンロード・印刷できます）"
      : `送信に失敗しました（${result.error || "不明なエラー"}）。下からダウンロードして保存してください。`;
  });

  document.getElementById("download-btn").addEventListener("click", async () => {
    const btn = document.getElementById("download-btn");
    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = "作成中...";
    const namePart = state.profile.name ? state.profile.name.replace(/\s+/g, "") : "result";
    try {
      await elementToPdf(document.getElementById("pdf-area-step4"), `探究テーマ_小学生版結果_${namePart}.pdf`);
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  });
  document.getElementById("print-btn").addEventListener("click", () => window.print());
  document.getElementById("restart-btn").addEventListener("click", () => {
    if (confirm("入力した内容をすべて消して最初からやり直しますか？")) {
      esResetState();
      goTo("start.html");
    }
  });
  document.getElementById("finish-btn").addEventListener("click", () => {
    if (confirm("終了しますか？（この端末から自分の回答は消え、ログアウトします）")) {
      esResetState();
      logout();
    }
  });
</script>
</body>
</html>
