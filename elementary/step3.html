<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/jpeg" href="../favicon.jpg">
<title>STEP3 ことばをあつめよう｜探究テーマ発見ワークシート（小学生版）</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="app">
  <div id="app-header"></div>

  <div class="card">
    <h2>STEP3　気になることばをあつめよう！</h2>
    <p class="lead">STEP2で多かったグループを中心に、「ちょっと気になる」ことばを2〜3こえらぼう。自分で思いついたことばを「その他」に書いてもOK！</p>
    <div class="select-count" id="count"></div>
  </div>

  <div class="card" id="cat-list"></div>

  <div id="nav"></div>
</div>

<script src="../app.js"></script>
<script>
  renderHeader(3, { labels: ES_STEP_LABELS, total: ES_STEP_LABELS.length - 1 });
  const state = esLoadState();
  if (!state.scores) goTo("step1.html");

  const order = topCategories(state.scores, 6).map(c => c.key);

  const listEl = document.getElementById("cat-list");
  listEl.innerHTML = order.map(k => {
    const cat = esCategoryByKey(k);
    const selected = state.keywords[k] || [];
    return `
      <div class="cat-block">
        <h3 style="color:${cat.color}">${cat.name}</h3>
        <p class="cat-desc">${cat.desc}</p>
        <div class="chip-grid">
          ${cat.keywords.map(kw => `
            <label class="chip">
              <input type="checkbox" data-cat="${k}" value="${kw}" ${selected.includes(kw) ? "checked" : ""}>
              <span class="chip-label" style="--c:${cat.color}">${kw}</span>
            </label>
          `).join("")}
        </div>
        <label class="field" style="margin-top:10px;">その他（自由記入）
          <input type="text" id="other-${k}" value="${state.customKeywords[k] || ""}" placeholder="思いついたことばがあれば">
        </label>
      </div>
    `;
  }).join("");

  document.querySelectorAll(".chip input").forEach(input => {
    const cat = esCategoryByKey(input.dataset.cat);
    const labelEl = input.nextElementSibling;
    const apply = () => {
      if (input.checked) {
        labelEl.style.background = cat.color;
        labelEl.style.color = "#fff";
      } else {
        labelEl.style.background = "";
        labelEl.style.color = "";
      }
    };
    apply();
    input.addEventListener("change", () => { apply(); updateCount(); });
  });

  function updateCount() {
    const n = document.querySelectorAll(".chip input:checked").length;
    const countEl = document.getElementById("count");
    countEl.textContent = `選択中：${n}個（目安は2〜3個）`;
    countEl.className = "select-count" + (n < 2 || n > 3 ? " warn" : "");
  }
  updateCount();

  navButtons("nav", {
    prevHref: "step2.html",
    nextLabel: "次へ →",
    onNext: () => {
      const keywords = { A: [], B: [], C: [], D: [], E: [], F: [] };
      document.querySelectorAll(".chip input:checked").forEach(input => {
        keywords[input.dataset.cat].push(input.value);
      });
      const customKeywords = {};
      order.forEach(k => {
        customKeywords[k] = document.getElementById(`other-${k}`).value.trim();
      });
      state.keywords = Object.assign(state.keywords, keywords);
      state.customKeywords = Object.assign(state.customKeywords, customKeywords);
      esSaveState(state);
      goTo("step4.html");
    }
  });
</script>
</body>
</html>
